name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Compiled here rather than committed, so the repo never carries a binary
      # that can disagree with the wiki it was rendered from.
      - name: Compile CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: cv.tex

      - name: Build Quartz site from wiki folder
        uses: konstfish/quartz-build-action@v7
        with:
          source: wiki
          destination: public
          page_title: Sadra Sabouri

      # After the Quartz build, which owns the contents of public/.
      # Served at https://sadrasabouri.github.io/cv/cv.pdf
      - name: Add CV PDF to the site
        run: cp latex/cv.pdf public/cv.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
